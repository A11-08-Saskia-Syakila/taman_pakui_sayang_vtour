<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taman Pakui Sayang | Interactive Virtual Tour</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        header {
            padding: 18px 22px;
            background: #17243a;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .intro {
            margin: 8px 0 0;
            color: #d3e2f1;
            font-size: 14px;
            line-height: 1.5;
        }

        #panorama {
            width: 100%;
            height: 70vh;
            min-height: 350px;
            background: #17243a;
        }

        .navigation {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 15px;
            background: #17243a;
        }

        button {
            padding: 10px 14px;
            border: 1px solid #54718f;
            border-radius: 6px;
            background: #263b55;
            color: white;
            cursor: pointer;
        }

        button:hover,
        button.active {
            background: #2d86a6;
        }

        #status {
            padding: 10px;
            text-align: center;
            background: #17243a;
            color: #d3e2f1;
            font-size: 13px;
        }

        footer {
            padding: 15px;
            text-align: center;
            background: #0b1220;
            color: #cbd5e1;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 19px;
            }

            #panorama {
                height: 60vh;
            }

            button {
                padding: 9px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Taman Pakui Sayang | Interactive Virtual Tour</h1>
        <p class="intro">
            Drag to look around. Click hotspots to change locations;
            click info icons for explanations.
        </p>
    </header>

    <main>
        <div id="panorama"></div>
    </main>

    <nav class="navigation">
        <button data-scene="pintu_masuk">Pintu Masuk</button>
        <button data-scene="parkir">Area Parkir</button>
        <button data-scene="lapangan_terbuka">Lapangan Terbuka</button>
        <button data-scene="jogging_track">Jogging Track</button>
        <button data-scene="classroom">Classroom</button>
        <button data-scene="library">Library</button>
    </nav>

    <div id="status">Memuat panorama...</div>

    <footer>
        Built with Pannellum, HTML, CSS, JavaScript and GitHub Pages.
    </footer>

    <script>
        const scenes = {
            pintu_masuk: {
                title: "Pintu Masuk",
                type: "equirectangular",
                panorama: "images/pintu_masuk.jpeg",
                yaw: 0,
                pitch: 0,
                hotSpots: [
                    {
                        pitch: 0,
                        yaw: 35,
                        type: "scene",
                        text: "Menuju Area Parkir",
                        sceneId: "parkir"
                    },
                    {
                        pitch: 10,
                        yaw: -40,
                        type: "info",
                        text: "Selamat datang di Taman Pakui Sayang!"
                    }
                ]
            },

            parkir: {
                title: "Area Parkir",
                type: "equirectangular",
                panorama: "images/parkir.jpeg",
                yaw: 0,
                pitch: 0,
                hotSpots: [
                    {
                        pitch: 0,
                        yaw: -35,
                        type: "scene",
                        text: "Kembali ke Pintu Masuk",
                        sceneId: "pintu_masuk"
                    },
                    {
                        pitch: 0,
                        yaw: 40,
                        type: "scene",
                        text: "Menuju Lapangan Terbuka",
                        sceneId: "lapangan_terbuka"
                    },
                    {
                        pitch: 10,
                        yaw: 0,
                        type: "info",
                        text: "Area parkir pengunjung."
                    }
                ]
            },

            lapangan_terbuka: {
                title: "Lapangan Terbuka",
                type: "equirectangular",
                panorama: "images/lapangan_terbuka.jpeg",
                yaw: 0,
                pitch: 0,
                hotSpots: [
                    {
                        pitch: 0,
                        yaw: -40,
                        type: "scene",
                        text: "Kembali ke Area Parkir",
                        sceneId: "parkir"
                    },
                    {
                        pitch: 0,
                        yaw: 40,
                        type: "scene",
                        text: "Menuju Jogging Track",
                        sceneId: "jogging_track"
                    },
                    {
                        pitch: 0,
                        yaw: 140,
                        type: "scene",
                        text: "Menuju Classroom",
                        sceneId: "classroom"
                    },
                    {
                        pitch: 10,
                        yaw: 0,
                        type: "info",
                        text: "Area terbuka untuk beraktivitas."
                    }
                ]
            },

            jogging_track: {
                title: "Jogging Track",
                type: "equirectangular",
                panorama: "images/jogging_track.jpeg",
                yaw: 0,
                pitch: 0,
                hotSpots: [
                    {
                        pitch: 0,
                        yaw: -40,
                        type: "scene",
                        text: "Kembali ke Lapangan Terbuka",
                        sceneId: "lapangan_terbuka"
                    },
                    {
                        pitch: 0,
                        yaw: 40,
                        type: "scene",
                        text: "Menuju Classroom",
                        sceneId: "classroom"
                    },
                    {
                        pitch: 10,
                        yaw: 0,
                        type: "info",
                        text: "Jalur untuk berjalan santai dan berolahraga."
                    }
                ]
            },

            classroom: {
                title: "Classroom",
                type: "equirectangular",
                panorama: "images/classroom.jpeg",
                yaw: 0,
                pitch: 0,
                hotSpots: [
                    {
                        pitch: 0,
                        yaw: -40,
                        type: "scene",
                        text: "Kembali ke Lapangan Terbuka",
                        sceneId: "lapangan_terbuka"
                    },
                    {
                        pitch: 0,
                        yaw: 40,
                        type: "scene",
                        text: "Menuju Library",
                        sceneId: "library"
                    },
                    {
                        pitch: 10,
                        yaw: 0,
                        type: "info",
                        text: "Area kegiatan belajar."
                    }
                ]
            },

            library: {
                title: "Library",
                type: "equirectangular",
                panorama: "images/library.jpeg",
                yaw: 0,
                pitch: 0,
                hotSpots: [
                    {
                        pitch: 0,
                        yaw: -40,
                        type: "scene",
                        text: "Kembali ke Classroom",
                        sceneId: "classroom"
                    },
                    {
                        pitch: 0,
                        yaw: 40,
                        type: "scene",
                        text: "Kembali ke Pintu Masuk",
                        sceneId: "pintu_masuk"
                    },
                    {
                        pitch: 10,
                        yaw: 0,
                        type: "info",
                        text: "Area membaca dan belajar."
                    }
                ]
            }
        };

        const viewer = pannellum.viewer("panorama", {
            default: {
                firstScene: "pintu_masuk",
                sceneFadeDuration: 700,
                autoLoad: true,
                hfov: 100,
                minHfov: 40,
                maxHfov: 120,
                showControls: true,
                showFullscreenCtrl: true,
                showZoomCtrl: true
            },
            scenes: scenes
        });

        const status = document.getElementById("status");
        const buttons = document.querySelectorAll("[data-scene]");

        function updateScene(sceneId) {
            const scene = scenes[sceneId];

            if (!scene) return;

            status.textContent = "Lokasi saat ini: " + scene.title;

            buttons.forEach(function(button) {
                button.classList.toggle(
                    "active",
                    button.dataset.scene === sceneId
                );
            });
        }

        viewer.on("scenechange", function(sceneId) {
            updateScene(sceneId);
        });

        buttons.forEach(function(button) {
            button.addEventListener("click", function() {
                viewer.loadScene(button.dataset.scene);
            });
        });

        viewer.on("error", function(error) {
            status.textContent =
                "Gambar gagal dimuat. Periksa nama file dan folder images.";
            console.error(error);
        });

        updateScene("pintu_masuk");
    </script>

</body>
</html>
